<nav class="bg-white/80 dark:bg-[#101010] backdrop-blur-md border-b border-slate-200 dark:border-slate-600 sticky top-0 z-40 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      
      <!-- Brand & Desktop Nav -->
      <div class="flex items-center">
        <!-- Logo -->
        <a routerLink="/" class="flex items-center gap-2 group">
          <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7 2a2 2 0 00-2 2v1H3a1 1 0 000 2h2v2H3a1 1 0 000 2h2v2H3a1 1 0 000 2h2v1a2 2 0 002 2h6a2 2 0 002-2v-1h2a1 1 0 000-2h-2v-2h2a1 1 0 000-2h-2V7h2a1 1 0 000-2h-2V4a2 2 0 00-2-2H7zm3 8a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
            </svg>
          </div>
          <span class="text-xl font-bold bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-400 bg-clip-text text-transparent">
            Hospital<span class="font-normal text-blue-600">App</span>
          </span>
        </a>

        <!-- Desktop Navigation -->
        <div class="hidden md:ml-8 md:flex md:space-x-4">
          @if (canRegisterOrBook()) {
            <a 
              routerLink="/register-patient" 
              routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300 border-blue-500"
              class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all border-b-2 border-transparent"
              id="nav-register-patient"
            >
              Register Patient
            </a>
            <a 
              routerLink="/book-appointment" 
              routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300 border-blue-500"
              class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all border-b-2 border-transparent"
              id="nav-book-appointment"
            >
              Book Appointment
            </a>
          }
        </div>
      </div>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-2 sm:gap-4">
        
        <!-- Theme Toggle Button -->
        <button 
          (click)="toggleTheme()"
          class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
          [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        >
          @if (isDarkMode()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        <app-profile-dropdown />
        
        <!-- Mobile Menu Button -->
        <button 
          (click)="toggleMobileMenu()"
          class="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          aria-label="Toggle menu"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (isMobileMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Navigation -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 animate-in slide-in-from-top duration-300">
      <div class="px-2 pt-2 pb-3 space-y-1">
        @if (canRegisterOrBook()) {
          <a 
            routerLink="/register-patient" 
            (click)="isMobileMenuOpen.set(false)"
            routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300"
            class="block px-3 py-2 rounded-lg text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800"
          >
            Register Patient
          </a>
          <a 
            routerLink="/book-appointment" 
            (click)="isMobileMenuOpen.set(false)"
            routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300"
            class="block px-3 py-2 rounded-lg text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800"
          >
            Book Appointment
          </a>
        }
        <a 
          routerLink="/profile" 
          (click)="isMobileMenuOpen.set(false)"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300"
          class="block px-3 py-2 rounded-lg text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800"
        >
          View Profile
        </a>
      </div>
    </div>
  }
</nav>
