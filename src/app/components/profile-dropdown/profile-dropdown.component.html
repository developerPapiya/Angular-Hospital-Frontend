<div 
  class="relative" 
  (mouseenter)="isOpen.set(true)" 
  (mouseleave)="isOpen.set(false)"
>
  <!-- Avatar / Trigger -->
  <button 
    type="button" 
    class="flex items-center gap-3 p-1 rounded-full hover:bg-slate-100  dark:hover:bg-white/10 transition-colors cursor-pointer group"
    id="profile-dropdown-trigger"
  >
    <div class="w-9 h-9 rounded-full bg-orange-300 flex items-center justify-center text-black text-sm font-bold shadow-sm group-hover:shadow-md transition-all">
      {{ userInitials() }}
    </div>
    <span class="hidden md:block text-sm font-medium text-slate-700 dark:text-slate-200">
      {{ userName() }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-200 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown Menu -->
  @if (isOpen()) {
    <div 
      class="absolute right-0  w-56 backdrop-blur-lg bg-white   dark:bg-[#1c1c1c] border border-slate-200 dark:border-white/20 rounded-xl shadow-xl z-50 overflow-hidden animate-in fade-in zoom-in duration-200"
      id="profile-dropdown-menu"
    >
      <div class="p-4 border-b border-slate-100 dark:border-white/20">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Account</p>
        <p class="text-sm font-medium text-slate-900 dark:text-white truncate">{{ userName() }}</p>
      </div>
      
      <div class="py-2">
        <a 
          routerLink="/profile" 
          class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors"
          id="nav-profile-link"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          View Profile
        </a>
      </div>

      <div class="py-2 border-t border-slate-100 dark:border-white/20">
        <button 
          (click)="onLogout()" 
          class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors cursor-pointer"
          id="logout-button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Logout
        </button>
      </div>
    </div>
  }
</div>
