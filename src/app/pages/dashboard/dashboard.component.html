<div
  class="min-h-screen dark:bg-[#101010] px-4 py-8 relative overflow-hidden transition-colors duration-500"
>
  <!-- Error Message Alert -->
  @if (errorMsg()) {
    <div
      id="login-error-alert"
      class="mb-6 mx-auto max-w-2xl flex items-start gap-3 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-600 dark:text-red-300 text-sm animate-in bounce-in"
    >
      <span>{{ errorMsg() }}</span>
    </div>
  }

  <!-- Cards Container -->
  <div class="flex flex-wrap items-center justify-center mt-8 gap-6 relative z-10">
    <!-- Card 1: Total Patients -->
    <div class="w-xs max-w-md">
      <div
        class="bg-white/80 dark:bg-[#1c1c1c] backdrop-blur-xl border border-white dark:border-white/10 rounded-3xl shadow-xl p-4 sm:p-5 transition-all duration-500"
      >
        <div class="text-center mb-2 mt-2">
          <h1 class="text-2xl sm:text-2xl font-bold text-slate-700 dark:text-white tracking-tight">
            Total Patients
          </h1>
          @if (allPatients()) {
            <span class="text-slate-500 dark:text-slate-400 mt-2 text-xl sm:text-xl font-medium">
               {{ allPatients()?.pagination?.total ?? 0 }}
            </span>
          }
        </div>
      </div>
    </div>

    <!-- Card 2: Total Doctors -->
    <div class="w-xs max-w-md">
      <div
        class="bg-white/80 dark:bg-[#1c1c1c] backdrop-blur-xl border border-white dark:border-white/10 rounded-3xl shadow-xl p-4 sm:p-5 transition-all duration-500"
      >
        <div class="text-center mb-2 mt-2">
          <h1 class="text-2xl sm:text-2xl font-bold text-slate-700 dark:text-white tracking-tight">
            Total Doctors
          </h1>
          @if (allDoctors()) {
            <span class="text-slate-500 dark:text-slate-400 mt-2 text-xl sm:text-xl font-medium">
              {{ allDoctors()?.length ?? 0 }}
            </span>
          }
        </div>
      </div>
    </div>

    <!-- Card 3: Total Appointments -->
    <div class="w-xs max-w-md">
      <div
        class="bg-white/80 dark:bg-[#1c1c1c] backdrop-blur-xl border border-white dark:border-white/10 rounded-3xl shadow-xl p-4 sm:p-5 transition-all duration-500"
      >
        <div class="text-center mb-2 mt-2">
          <h1 class="text-2xl sm:text-2xl font-bold text-slate-700 dark:text-white tracking-tight">
            Total Appointments
          </h1>
          @if (allAppointments()) {
            <span class="text-slate-500 dark:text-slate-400 mt-2 text-xl sm:text-xl font-medium">
              {{ allAppointments()?.pagination?.total ?? 0 }}
            </span>
          }
        </div>
      </div>
    </div>
  </div>
</div>
